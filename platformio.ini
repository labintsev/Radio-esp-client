; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-S3 DevKitC-1, модуль N16R8: 16 МБ flash (quad) + 8 МБ PSRAM (octal).
; memory_type qio_opi обязателен: иначе PSRAM не поднимется, а GPIO33..37 будут
; заняты линиями octal-PSRAM.
[env:esp32-s3-devkitc-1]
; Пин на 7.1.3 (Arduino core 2.0.17): в 55.03.312 (core 3.3.12) пакет
; esp32-core-3.3.12-libs не распаковывается в Windows — путь внутри архива
; длиннее 260 символов (MAX_PATH).
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps = 
    pu2clr/PU2CLR SI470X